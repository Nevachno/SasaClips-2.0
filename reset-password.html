<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Новый пароль — SasaClips</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        <span class="logo-icon">S</span>

        <span>
            Sasa<span>Clips</span>
        </span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Главная
        </a>

        <a href="index.html#clips">
            Популярное
        </a>

        <a href="rules.html">
            Правила
        </a>

    </nav>

    <div class="nav-actions">

        <a
            href="login.html"
            class="login-button"
        >
            Войти
        </a>

    </div>

</header>


<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                S
            </div>

            <span class="section-label">
                NEW PASSWORD
            </span>

            <h1>
                Новый пароль
            </h1>

            <p>
                Придумай новый пароль для входа
                в аккаунт SasaClips.
            </p>

        </div>


        <div
            class="upload-message error"
            id="resetInvalidLinkMessage"
            hidden
        >
            Ссылка недействительна или устарела.
            Запроси новую ссылку на странице
            «Забыли пароль?».
        </div>


        <form id="resetPasswordForm">


            <div class="form-group">

                <label for="resetNewPassword">
                    Новый пароль
                </label>

                <input
                    type="password"
                    id="resetNewPassword"
                    placeholder="Минимум 8 символов"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="resetConfirmPassword">
                    Подтверждение пароля
                </label>

                <input
                    type="password"
                    id="resetConfirmPassword"
                    placeholder="Повторите новый пароль"
                    minlength="8"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
                id="resetPasswordButton"
            >
                Сохранить новый пароль
            </button>


            <p
                id="resetPasswordMessage"
                class="auth-message"
            ></p>

        </form>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="reset-password.js"></script>

</body>
</html>
