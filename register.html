<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Регистрация — SasaClips</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        <span class="logo-icon">S</span>

        <span>
            Sasa<span>Clips</span>
        </span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Главная
        </a>

        <a href="index.html#clips">
            Популярное
        </a>

        <a href="rules.html">
            Правила
        </a>

    </nav>

    <div class="nav-actions">

        <a
            href="login.html"
            class="login-button"
        >
            Войти
        </a>

    </div>

</header>


<main class="auth-page">

    <section class="auth-card register-card">

        <div class="auth-header">

            <div class="auth-logo">
                S
            </div>

            <span class="section-label">
                JOIN THE COMMUNITY
            </span>

            <h1>
                Создай аккаунт
            </h1>

            <p>
                Присоединяйся к сообществу
                и загружай свои лучшие клипы.
            </p>

        </div>


        <form id="registerForm">


            <div class="form-group">

                <label for="registerUsername">
                    Никнейм
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="например, sasafan"
                    minlength="3"
                    required
                >

                <small>
                    От 3 символов
                </small>

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Пароль
                </label>

               <input
                 type="password"
                 id="registerPassword"
                 placeholder="Минимум 8 символов"
                 minlength="8"
                 required
>

<small>
    Используй минимум 8 символов
</small>

            </div>


            <button
                type="submit"
                class="auth-submit"
            >
                Создать аккаунт
            </button>


            <p
                id="registerMessage"
                class="auth-message"
            ></p>

        </form>


        <div class="auth-footer">

            Уже есть аккаунт?

            <a href="login.html">
                Войти
            </a>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="register.js"></script>

</body>
</html>
