<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Восстановление пароля — SasaClips</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        <span class="logo-icon">S</span>

        <span>
            Sasa<span>Clips</span>
        </span>
    </a>

    <nav class="nav-links">

        <a href="index.html">
            Главная
        </a>

        <a href="index.html#clips">
            Популярное
        </a>

        <a href="rules.html">
            Правила
        </a>

    </nav>

    <div class="nav-actions">

        <a
            href="login.html"
            class="login-button"
        >
            Войти
        </a>

    </div>

</header>


<main class="auth-page">

    <section class="auth-card">

        <div class="auth-header">

            <div class="auth-logo">
                S
            </div>

            <span class="section-label">
                PASSWORD RECOVERY
            </span>

            <h1>
                Забыли пароль?
            </h1>

            <p>
                Введи email, указанный при регистрации —
                пришлём ссылку для сброса пароля.
            </p>

        </div>


        <form id="forgotPasswordForm">


            <div class="form-group">

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
                id="forgotPasswordButton"
            >
                Отправить ссылку
            </button>


            <p
                id="forgotPasswordMessage"
                class="auth-message"
            ></p>

        </form>


        <div class="auth-footer">

            Вспомнили пароль?

            <a href="login.html">
                Войти
            </a>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="forgot-password.js"></script>

</body>
</html>
